name: hunlife
description: Learn Hungarian in Ukrainian — lessons, topics, flashcards, and citizenship interview prep.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.6.0
  go_router: ^14.2.7
  intl: ^0.19.0
  # Pronunciation: real Hungarian audio is synthesised server-side and cached,
  # so every learner hears the same correct voice. flutter_tts stays only as a
  # last-resort fallback when that audio can't be reached.
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0
  http: ^1.2.2
  youtube_player_iframe: ^5.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
